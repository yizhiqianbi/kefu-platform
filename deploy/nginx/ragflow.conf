server {
    listen 0.0.0.0:21048;
    server_name _;
    root /home/hubin/ragflow-local/ragflow/web/dist;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 9;
    gzip_types text/plain application/javascript application/x-javascript text/css application/xml text/javascript application/x-httpd-php image/jpeg image/gif image/png;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # 木序客服前端（muxu/server.py）
    location ^~ /muxu {
        proxy_pass http://127.0.0.1:8770;
        include /home/hubin/ragflow-local/nginx/proxy.conf;
    }

    location ~ ^/api/v1/admin {
        proxy_pass http://127.0.0.1:9381;
        include /home/hubin/ragflow-local/nginx/proxy.conf;
    }

    location ~ ^/(v1|api) {
        proxy_pass http://127.0.0.1:9380;
        include /home/hubin/ragflow-local/nginx/proxy.conf;
    }

    # MCP server (--enable-mcpserver), streamable HTTP transport
    location ~ ^/mcp(/|$) {
        proxy_pass http://127.0.0.1:9382;
        include /home/hubin/ragflow-local/nginx/proxy.conf;
    }


    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Cache-Control: max-age Expires
    location ~ ^/static/(css|js|media)/ {
        expires 10y;
        access_log off;
    }
}
