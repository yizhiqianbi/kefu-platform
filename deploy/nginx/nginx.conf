user root;
worker_processes 4;
pid /home/hubin/ragflow-local/nginx/nginx.pid;
error_log /home/hubin/ragflow-local/logs/nginx_error.log;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /home/hubin/ragflow-local/logs/nginx_access.log;
    client_body_temp_path /home/hubin/ragflow-local/nginx/tmp;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 1024M;
    include /home/hubin/ragflow-local/nginx/ragflow.conf;
}
